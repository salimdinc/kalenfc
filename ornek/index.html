<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmet Usta | Kale NFC Örnek Profil</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .profile-card { width: 100%; max-width: 400px; background: var(--card); border-radius: 24px; padding: 32px 20px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        .avatar { width: 90px; height: 90px; border-radius: 50%; background: var(--accent); margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 36px; color: white; font-weight: 700; }
        .name { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .title { font-size: 14px; color: var(--accent); font-weight: 600; margin-bottom: 16px; }
        .bio { font-size: 13px; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        .link-btn { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.05); padding: 14px 18px; border-radius: 12px; color: var(--text); text-decoration: none; font-weight: 500; font-size: 14px; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
        .link-btn:hover { background: var(--accent); border-color: var(--accent); }
        .link-btn i { font-size: 18px; width: 24px; text-align: center; }
        .badge { margin-top: 24px; font-size: 11px; color: var(--muted); }
        .badge span { color: var(--accent); font-weight: 600; }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="avatar">AU</div>
        <div class="name">Ahmet Yılmaz</div>
        <div class="title">Usta & İşletme Sahibi</div>
        <div class="bio">Kale NFC akıllı dijital kartvizit sistemleri örnek profili. Tek dokunuşla rehbere kaydedin.</div>
        
        <div class="links">
            <a href="tel:+905000000000" class="link-btn"><i class="fa-solid fa-phone"></i> Hemen Ara</a>
            <a href="https://wa.me/905000000000" class="link-btn"><i class="fa-brands fa-whatsapp"></i> WhatsApp Mesaj Gönder</a>
            <a href="mailto:ornek@kalenfc.com" class="link-btn"><i class="fa-solid fa-envelope"></i> E-Posta Gönder</a>
            <a href="#" class="link-btn"><i class="fa-solid fa-location-dot"></i> Konumu Görüntüle</a>
        </div>
        
        <div class="badge">Bu kart <span>Kale NFC</span> ile oluşturulmuştur.</div>
    </div>
</body>
</html>
